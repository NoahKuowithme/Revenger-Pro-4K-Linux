app-id: io.noah.revengerpro4k
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: revenger-pro-4k
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Needed to open the receiver's /dev/hidrawN node. This is a broad device
  # permission; Flatpak currently has no per-hidraw device permission.
  - --device=all
  # The app reads HID uevent data and report descriptors from sysfs.
  - --filesystem=/sys:ro
modules:
  - name: revenger-pro-4k
    buildsystem: simple
    build-commands:
      - install -d /app/share/revenger-pro-4k
      - cp -a revengerctl revenger-pro-4k revengerctl-cli /app/share/revenger-pro-4k/
      - install -Dm755 flatpak-launcher.sh /app/bin/revenger-pro-4k
      - install -Dm644 io.noah.revengerpro4k.desktop /app/share/applications/io.noah.revengerpro4k.desktop
      - install -Dm644 icons/io.noah.revengerpro4k.svg /app/share/icons/hicolor/scalable/apps/io.noah.revengerpro4k.svg
      - install -Dm644 io.noah.revengerpro4k.metainfo.xml /app/share/metainfo/io.noah.revengerpro4k.metainfo.xml
    sources:
      - type: git
        url: https://github.com/NoahKuowithme/Revenger-Pro-4K-Linux.git
        commit: 099539f35394edef6bfa50e5c911e008ea291bdc
      - type: file
        path: io.noah.revengerpro4k.desktop
      - type: file
        path: icons/io.noah.revengerpro4k.svg
      - type: file
        path: io.noah.revengerpro4k.metainfo.xml
      - type: file
        path: flatpak-launcher.sh
